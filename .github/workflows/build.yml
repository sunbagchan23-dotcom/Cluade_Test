name: Build IPA

# 버전 규칙
# - 버전 번호는 project.yml의 MARKETING_VERSION과 CHANGELOG.md에 적는다.
# - v로 시작하는 태그(v0.2.2 등)를 올리면 그 버전으로 빌드하고 GitHub Release에 IPA를 영구 보관한다.
#   (일반 빌드 결과물(Artifacts)은 30일 뒤 지워진다.)
# - 예전 버전을 다시 받고 싶으면 Actions → Build IPA → Run workflow 에서 ref에 태그(v0.1.0 등)를 넣는다.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "빌드할 태그나 커밋 (비우면 이 브랜치). v로 시작하는 태그면 Release도 만든다."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 버전 설명(CHANGELOG.md)은 예전 버전을 빌드할 때도 최신 것을 쓰려고 따로 받는다.
      - uses: actions/checkout@v4
        with:
          path: _meta
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Decide version
        id: ver
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # 태그 빌드면 태그에서, 아니면 project.yml에서 버전을 읽는다.
          REF="${INPUT_REF:-$GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"; TAG="$REF"
          else
            VERSION=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION tag=$TAG"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ScreenOCRTest.xcodeproj \
            -scheme ScreenOCRTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/ScreenOCRTest.app
          ls "$APP/PlugIns"
          echo "앱 버전: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist"))"
          # 서명 없는 빌드에는 권한(App Group) 정보가 빠지므로 임시 서명으로 넣어 둔다.
          # Sideloadly/AltStore가 이 정보를 보고 무료 계정용 App Group을 만든다.
          codesign --force --sign - --entitlements Extension/Extension.entitlements "$APP/PlugIns/BroadcastExt.appex"
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP/PlugIns/BroadcastExt.appex"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry "ScreenOCRTest-v${{ steps.ver.outputs.version }}.ipa" Payload && ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOCRTest-v${{ steps.ver.outputs.version }}-ipa
          path: out/*.ipa
          retention-days: 30

      - name: Publish release (tags only)
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # CHANGELOG.md에서 이 버전 부분만 뽑아 Release 설명으로 쓴다.
          NOTES="버전 $VERSION"
          if [ -f _meta/CHANGELOG.md ]; then
            SECTION=$(awk -v v="## v$VERSION" 'index($0,v)==1{f=1;next} /^## v/{f=0} f' _meta/CHANGELOG.md)
            [ -n "$SECTION" ] && NOTES="$SECTION"
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.ipa --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/*.ipa -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"
          fi
