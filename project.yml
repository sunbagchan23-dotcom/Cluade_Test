name: ScreenOCRTest
options:
  bundleIdPrefix: com.sunbag
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  ScreenOCRTest:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunbag.screenocr
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OCR시험
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupID: group.com.sunbag.screenocr
    dependencies:
      - target: BroadcastExt
        embed: true
  BroadcastExt:
    type: app-extension
    platform: iOS
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunbag.screenocr.broadcast
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: OCR시험 방송
        AppGroupID: group.com.sunbag.screenocr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
schemes:
  ScreenOCRTest:
    build:
      targets:
        ScreenOCRTest: all
        BroadcastExt: all
